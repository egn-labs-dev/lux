<!-- Lightbox Modal -->
<div class="wix-lightbox" id="portfolio-lightbox" onclick="closeLightbox(event)">
    <button class="wix-lightbox-close" onclick="closeLightbox(event)">&times;</button>
    <img src="" alt="" class="wix-lightbox-img" id="lightbox-img">
    <div class="wix-lightbox-caption" id="lightbox-caption"></div>
</div>

<script>
    // Toggle Accordion Album
    function toggleAlbum(element) {
        const album = element.parentElement;
        
        // Close others (Optional, if you only want one open at a time)
        // document.querySelectorAll('.wix-album').forEach(a => {
        //     if (a !== album) a.classList.remove('active');
        // });

        album.classList.toggle('active');
    }

    // Lightbox Logic
    const lightbox = document.getElementById('portfolio-lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');

    function openLightbox(imgSrc, captionText) {
        lightboxImg.src = imgSrc;
        lightboxCaption.innerText = captionText || '';
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden'; // prevent background scrolling
    }

    function closeLightbox(e) {
        // Close if clicked on background or close button, not on image itself
        if (e.target === lightbox || e.target.classList.contains('wix-lightbox-close')) {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            setTimeout(() => { lightboxImg.src = ''; }, 300); // clear after fade out
        }
    }
</script>
